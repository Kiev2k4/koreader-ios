name: Build KOReader iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          brew install autoconf automake bash binutils cmake coreutils findutils \
            gettext gnu-getopt libtool make meson nasm ninja pkgconf sdl3 \
            util-linux xcodegen
          echo "$(brew --prefix)/opt/findutils/libexec/gnubin:$(brew --prefix)/opt/gnu-getopt/bin:$(brew --prefix)/opt/make/libexec/gnubin:$(brew --prefix)/opt/util-linux/bin" >> $GITHUB_PATH

      - name: Build host LuaJIT and iOS Xcode project
        run: |
          make --version
          make TARGET=macos base
          make TARGET=ios xcodeproj

      - name: Build unsigned app bundle
        run: |
          xcodebuild -project KOReader.xcodeproj \
            -scheme KOReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "KOReader.app" -path "*-iphoneos*" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r KOReader-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KOReader-ios-ipa
          path: KOReader-unsigned.ipa
